name: Recipe Validation

# v0.31.0 — runs the per-recipe validation suite on every PR + push to main.
#
# Each recipe in src/soup_cli/recipes/catalog.py is parsed, loaded as a
# SoupConfig, and asserted to match its RecipeMeta declaration. Catches
# regressions when an upstream model id is renamed or removed, or when the
# config schema changes in a backward-incompatible way.
#
# A 100-step live smoke train per recipe is on the v0.31.1 roadmap and will
# require a self-hosted GPU runner; this workflow is the CPU-only validation
# tier that runs on every PR.

on:
  push:
    branches: [main]
    paths:
      - 'src/soup_cli/recipes/**'
      - 'src/soup_cli/config/**'
      - 'src/soup_cli/data/formats.py'
      - 'src/soup_cli/data/loader.py'
      - 'tests/test_recipes_v031.py'
      - 'tests/test_recipes.py'
      - '.github/workflows/recipe-validation.yml'
  pull_request:
    branches: [main]
    paths:
      - 'src/soup_cli/recipes/**'
      - 'src/soup_cli/config/**'
      - 'src/soup_cli/data/formats.py'
      - 'src/soup_cli/data/loader.py'
      - 'tests/test_recipes_v031.py'
      - 'tests/test_recipes.py'
      - '.github/workflows/recipe-validation.yml'

# Supersede, do not queue.
#
# Measured 2026-09-14: 49 of 83 queued runs were already obsolete -- a newer run
# existed on the same branch -- because no workflow declared a concurrency group,
# so every push left its predecessor queued forever. Arrival was 8.3 runs/hour
# against a service rate of 4.6, i.e. the queue diverged rather than backed up.
#
# Cancellation is deliberately PULL-REQUEST ONLY. A push to `main` keeps its own
# run: the release checklist requires a green matrix on the exact commit being
# tagged, and cancelling an in-flight tag run to serve a later docs push would
# destroy the one signal that gate depends on.
#
# What this costs: per-commit CI history WITHIN a pull request. Three pushes in
# a row now leave results for the third only. That is a signal the review rule
# already discards -- merge requires green on the CURRENT head -- which is why
# it is the right thing to trade.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  validate-recipes:
    runs-on: ubuntu-latest
    env:
      PYTHONUTF8: "1"
      PYTHONIOENCODING: "utf-8"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install -e ".[dev]"
      - name: Validate every recipe (parameterised pytest)
        run: pytest tests/test_recipes_v031.py tests/test_recipes.py -v --tb=short --no-cov
